name: DevSecOps Pipeline - Food Delivery (Scan & Build)

# ═══════════════════════════════════════════════════════════════════
# SCAN & BUILD PIPELINE
# - Secret scanning, SCA, image build, image scan, IaC scan
# - No AWS dependency (no ECR, EKS, SonarQube)
# - Dependency scan is non-blocking (reports findings, does not fail)
#
# TRIGGERS:
#   - Push / PR to master or main → Runs all stages
#   - Manual dispatch             → Runs all stages
# ═══════════════════════════════════════════════════════════════════

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "terraform/**"
      - "**/*.md"
      - ".github/dependabot.yml"
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "terraform/**"
      - "**/*.md"
  workflow_dispatch:

env:
  IMAGE_BACKEND: food-delivery-backend
  IMAGE_FRONTEND: food-delivery-frontend
  IMAGE_ADMIN: food-delivery-admin
  IMAGE_TAG: v${{ github.run_number }}

permissions:
  contents: read
  security-events: write

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # STAGE 1: SECRET SCANNING
  # ═══════════════════════════════════════════════════════════════════
  secret-scan:
    name: "Stage 1: Secret Scanning (Gitleaks)"
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════
  # STAGE 2: DEPENDENCY SCAN — SCA (non-blocking)
  # ═══════════════════════════════════════════════════════════════════
  dependency-scan:
    name: "Stage 2: Dependency Scan (Trivy FS)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trivy Filesystem Scan - Backend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "./backend"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      - name: Trivy Filesystem Scan - Frontend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "./frontend"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      - name: Trivy Filesystem Scan - Admin
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "./admin"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

  # ═══════════════════════════════════════════════════════════════════
  # STAGE 3: BUILD DOCKER IMAGES
  # ═══════════════════════════════════════════════════════════════════
  build-images:
    name: "Stage 3: Build Docker Images"
    runs-on: ubuntu-latest
    needs: [secret-scan, dependency-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        run: |
          docker build -t ${{ env.IMAGE_BACKEND }}:${{ env.IMAGE_TAG }} ./backend

      - name: Build Frontend Image
        run: |
          docker build -t ${{ env.IMAGE_FRONTEND }}:${{ env.IMAGE_TAG }} ./frontend

      - name: Build Admin Image
        run: |
          docker build -t ${{ env.IMAGE_ADMIN }}:${{ env.IMAGE_TAG }} ./admin

      - name: Save images for next stages
        run: |
          docker save ${{ env.IMAGE_BACKEND }}:${{ env.IMAGE_TAG }} -o backend-image.tar
          docker save ${{ env.IMAGE_FRONTEND }}:${{ env.IMAGE_TAG }} -o frontend-image.tar
          docker save ${{ env.IMAGE_ADMIN }}:${{ env.IMAGE_TAG }} -o admin-image.tar

      - name: Upload image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            backend-image.tar
            frontend-image.tar
            admin-image.tar
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════════
  # STAGE 4: CONTAINER IMAGE SCAN
  # ═══════════════════════════════════════════════════════════════════
  image-scan:
    name: "Stage 4: Container Image Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: [build-images]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download image artifacts
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Load images
        run: |
          docker load -i backend-image.tar
          docker load -i frontend-image.tar
          docker load -i admin-image.tar

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_BACKEND }}:${{ env.IMAGE_TAG }}"
          format: "sarif"
          output: "trivy-backend.sarif"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          scanners: "vuln"

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_FRONTEND }}:${{ env.IMAGE_TAG }}"
          format: "sarif"
          output: "trivy-frontend.sarif"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          scanners: "vuln"

      - name: Scan Admin Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_ADMIN }}:${{ env.IMAGE_TAG }}"
          format: "sarif"
          output: "trivy-admin.sarif"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          scanners: "vuln"

      - name: Upload Trivy Backend SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: "trivy-backend.sarif"
          category: "trivy-backend"

      - name: Upload Trivy Frontend SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: "trivy-frontend.sarif"
          category: "trivy-frontend"

      - name: Upload Trivy Admin SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: "trivy-admin.sarif"
          category: "trivy-admin"

  # ═══════════════════════════════════════════════════════════════════
  # STAGE 5: IaC SECURITY SCAN
  # ═══════════════════════════════════════════════════════════════════
  iac-scan:
    name: "Stage 5: IaC Scan (Checkov)"
    runs-on: ubuntu-latest
    needs: [build-images]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkov - Scan Kubernetes manifests
        uses: bridgecrewio/checkov-action@master
        with:
          directory: k8s/
          framework: kubernetes
          output_format: sarif
          soft_fail: false
          # CKV_K8S_43: Images use dynamic tags (built at runtime, digest not known at manifest creation)
          # CKV_K8S_35: Secrets injected via External Secrets Operator env vars (AWS Secrets Manager → K8s)
          # CKV_K8S_22: MongoDB requires writable /data/db filesystem by design
          skip_check: "CKV_K8S_43,CKV_K8S_35,CKV_K8S_22"

      - name: Checkov - Scan Dockerfiles
        uses: bridgecrewio/checkov-action@master
        with:
          file: backend/Dockerfile
          framework: dockerfile
          soft_fail: true
          skip_check: "CKV_DOCKER_2,CKV_DOCKER_7"

  # ═══════════════════════════════════════════════════════════════════
  # STAGE 6: PUSH TO DOCKER HUB
  # Runs on push to master/main and manual dispatch (not on PRs)
  # ═══════════════════════════════════════════════════════════════════
  push-to-dockerhub:
    name: "Stage 6: Push to Docker Hub"
    runs-on: ubuntu-latest
    needs: [image-scan, iac-scan]
    if: github.event_name != 'pull_request'
    env:
      DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Download image artifacts
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Load images
        run: |
          docker load -i backend-image.tar
          docker load -i frontend-image.tar
          docker load -i admin-image.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push images
        run: |
          for IMAGE in ${{ env.IMAGE_BACKEND }} ${{ env.IMAGE_FRONTEND }} ${{ env.IMAGE_ADMIN }}; do
            docker tag "$IMAGE:${{ env.IMAGE_TAG }}" "$DOCKERHUB_NAMESPACE/$IMAGE:${{ env.IMAGE_TAG }}"
            docker tag "$IMAGE:${{ env.IMAGE_TAG }}" "$DOCKERHUB_NAMESPACE/$IMAGE:latest"
            docker push "$DOCKERHUB_NAMESPACE/$IMAGE:${{ env.IMAGE_TAG }}"
            docker push "$DOCKERHUB_NAMESPACE/$IMAGE:latest"
          done
